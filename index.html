<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>한국학 석사과정 수요 조사</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <main class="wrap">
    <header class="card head">
      <h1 id="title"></h1>
      <p id="description"></p>
      <p class="req-note"><span class="req">*</span> 표시는 필수 문항입니다.</p>
    </header>

    <form id="surveyForm" novalidate></form>

    <section id="done" class="card done" hidden>
      <h2>제출이 완료되었습니다</h2>
      <p id="closing"></p>
      <button type="button" class="btn ghost" onclick="location.reload()">새 응답 작성</button>
    </section>
  </main>

  <script src="survey-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
